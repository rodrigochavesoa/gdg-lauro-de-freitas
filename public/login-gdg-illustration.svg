<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 620" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo e Cards -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.88"/>
    </linearGradient>

    <!-- Sombras Suaves Glassmorphism -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.03" />
    </filter>
  </defs>

  <!-- GDG Watermark Brackets no Fundo -->
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="38" fill="none" opacity="0.10" transform="translate(190, 40) scale(0.62)">
    <path d="M 198 156 L 76 256" stroke="#EA4335" />
    <path d="M 76 256 L 198 356" stroke="#4285F4" />
    <path d="M 314 356 L 436 256" stroke="#FBBC04" />
    <path d="M 314 156 L 436 256" stroke="#0F9D58" />
  </g>

  <!-- Pílula Flutuante Topo (DevOps) -->
  <g transform="translate(140, 20) rotate(-10)" filter="url(#softShadow)">
    <rect width="96" height="32" rx="16" fill="#FFFFFF" stroke="#F1F5F9"/>
    <circle cx="18" cy="16" r="6" fill="#EA4335"/>
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155">DevOps</text>
  </g>

  <!-- CARD 1: Vaga Tech em Destaque -->
  <g filter="url(#softShadow)" transform="translate(180, 50)">
    <rect width="390" height="170" rx="20" fill="url(#cardBg)" stroke="#FFFFFF" stroke-width="2"/>
    
    <rect x="24" y="22" width="90" height="26" rx="13" fill="#EFF6FF"/>
    <circle cx="36" cy="35" r="4" fill="#2563EB"/>
    <text x="46" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2563EB">GDG Match</text>

    <rect x="278" y="22" width="88" height="26" rx="13" fill="#ECFDF5"/>
    <text x="292" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#16A34A">98% Match</text>

    <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Senior Frontend Engineer</text>
    <text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748B">TechPartner • Remoto (Brasil)</text>

    <!-- Stacks -->
    <g transform="translate(24, 118)">
      <rect width="64" height="26" rx="8" fill="#F1F5F9"/>
      <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155">React</text>
      
      <rect x="72" width="76" height="26" rx="8" fill="#F1F5F9"/>
      <text x="84" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155">Next.js</text>

      <rect x="156" width="92" height="26" rx="8" fill="#F1F5F9"/>
      <text x="168" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155">TypeScript</text>
    </g>
  </g>

  <!-- Linha Conectora de Fluxo -->
  <path d="M 230 220 C 200 270, 160 280, 140 310" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- CARD 2: Comunidade & Estatísticas (GDG Lauro de Freitas) -->
  <g filter="url(#softShadow)" transform="translate(30, 260)">
    <rect width="370" height="150" rx="20" fill="url(#cardBg)" stroke="#FFFFFF" stroke-width="2"/>
    
    <g transform="translate(24, 22)">
      <circle cx="18" cy="18" r="18" fill="#EFF6FF"/>
      <path d="M 14 13 L 9 18 L 14 23" fill="none" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 22 13 L 27 18 L 22 23" fill="none" stroke="#0F9D58" stroke-width="2.5" stroke-linecap="round"/>
      
      <text x="46" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Comunidade Ativa</text>
      <text x="46" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Conectado ao GDG Lauro de Freitas</text>
    </g>

    <g transform="translate(24, 76)">
      <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155">+140 novas vagas esta semana</text>
      
      <rect y="24" width="320" height="8" rx="4" fill="#E2E8F0"/>
      <rect y="24" width="125" height="8" rx="4" fill="#4285F4"/>
      <rect x="120" y="24" width="75" height="8" fill="#EA4335"/>
      <rect x="190" y="24" width="65" height="8" fill="#FBBC04"/>
      <rect x="250" y="24" width="70" height="8" rx="4" fill="#0F9D58"/>
    </g>
    
    <text x="24" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Frontend • Backend • Mobile • Cloud</text>
  </g>

  <!-- Pílula Flutuante Direita (Flutter) -->
  <g transform="translate(500, 310) rotate(8)" filter="url(#softShadow)">
    <rect width="90" height="32" rx="16" fill="#FFFFFF" stroke="#F1F5F9"/>
    <circle cx="16" cy="16" r="6" fill="#0F9D58"/>
    <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#334155">Flutter</text>
  </g>

  <!-- CARD 3: 1-Click Apply Badge -->
  <g filter="url(#softShadow)" transform="translate(310, 430)">
    <rect width="280" height="74" rx="18" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
    
    <circle cx="40" cy="37" r="18" fill="#EFF6FF"/>
    <path d="M 33 37 L 38 42 L 47 32" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Candidatura em 1 Clique</text>
    <text x="68" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#16A34A">Perfil sincronizado</text>
  </g>

  <!-- Pílula Flutuante Inferior (Golang) -->
  <g transform="translate(40, 440) rotate(-6)" filter="url(#softShadow)">
    <rect width="96" height="32" rx="16" fill="#FFFFFF" stroke="#F1F5F9"/>
    <circle cx="18" cy="16" r="6" fill="#4285F4"/>
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#334155">Golang</text>
  </g>
</svg>
