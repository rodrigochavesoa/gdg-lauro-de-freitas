name: CI

on:
  push:
  pull_request:
  # Reexecução manual de `pnpm test:rls` após merge (rollback / incidente). Só o job
  # `rls` consome secrets, e apenas quando o ref é `main`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Bundle secrets
        run: pnpm check:bundle

      - name: Production migrations
        run: pnpm migrations:prod

  # Segredos privilegiados só neste job, só em código já mergeado em main.
  # Proibido: pull_request_target com checkout/execução de código da PR.
  # Falha aqui não bloqueia deploy Vercel (gate de confiança pós-merge + rollback).
  # Evolução futura (fora de escopo): deploy condicionado ao RLS; harness externo imutável.
  rls:
    name: RLS homolog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    environment: homolog-rls
    concurrency:
      group: rls-homolog-${{ github.repository }}
      cancel-in-progress: false
    # Homologação é compartilhada: serializa os jobs. Allowlist de eventos —
    # não usar `github.ref == main` sozinho (pull_request_target também aponta para main).
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      ADMIN_TEST_EMAIL: ${{ secrets.ADMIN_TEST_EMAIL }}
      ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
      CURATOR_TEST_EMAIL: ${{ secrets.CURATOR_TEST_EMAIL }}
      CURATOR_TEST_PASSWORD: ${{ secrets.CURATOR_TEST_PASSWORD }}
      CURATOR2_TEST_EMAIL: ${{ secrets.CURATOR2_TEST_EMAIL }}
      CURATOR2_TEST_PASSWORD: ${{ secrets.CURATOR2_TEST_PASSWORD }}
      CURATOR3_TEST_EMAIL: ${{ secrets.CURATOR3_TEST_EMAIL }}
      CURATOR3_TEST_PASSWORD: ${{ secrets.CURATOR3_TEST_PASSWORD }}
      MODERATOR_TEST_EMAIL: ${{ secrets.MODERATOR_TEST_EMAIL }}
      MODERATOR_TEST_PASSWORD: ${{ secrets.MODERATOR_TEST_PASSWORD }}
      ADMIN_TEST_TOTP_SECRET: ${{ secrets.ADMIN_TEST_TOTP_SECRET }}
      CURATOR_TEST_TOTP_SECRET: ${{ secrets.CURATOR_TEST_TOTP_SECRET }}
      CURATOR2_TEST_TOTP_SECRET: ${{ secrets.CURATOR2_TEST_TOTP_SECRET }}
      CURATOR3_TEST_TOTP_SECRET: ${{ secrets.CURATOR3_TEST_TOTP_SECRET }}
      MODERATOR_TEST_TOTP_SECRET: ${{ secrets.MODERATOR_TEST_TOTP_SECRET }}
      CANDIDATE_TEST_EMAIL: ${{ secrets.CANDIDATE_TEST_EMAIL }}
      CANDIDATE_TEST_PASSWORD: ${{ secrets.CANDIDATE_TEST_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: RLS (homologação)
        run: pnpm test:rls
